[package]
name = "inpaint-desktop"
version = "0.1.0"
description = "A local GPU-powered object removal tool"
authors = ["Inpaint contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "inpaint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.25"
tempfile = "3"
flate2 = "1"

# Thumbnail decoding remains responsive when ImageMagick is unavailable while
# running `tauri dev`, whose dependencies would otherwise be unoptimized.
[profile.dev.package."*"]
opt-level = 2
